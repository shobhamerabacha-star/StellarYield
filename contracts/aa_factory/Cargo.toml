[package]
name = "aa_factory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"
aa_proxy = { path = "../aa_proxy" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
